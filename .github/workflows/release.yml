name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A job-level `if` cannot read the `secrets` context, so the check is
      # lifted into an env var the step below can see.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Opens a version PR when changesets are pending, and publishes when that
      # PR is merged. Provenance ties the published tarball to this workflow
      # run, so the origin of a release is verifiable rather than asserted.
      # Without a token the action still opens the version PR, which is the
      # useful half — it just does not publish. Passing an empty `publish` is
      # how that is expressed, and it keeps the workflow from failing on every
      # push before the token exists.
      - uses: changesets/action@v1
        with:
          publish: ${{ env.HAS_NPM_TOKEN == 'true' && 'npm publish --provenance --access public' || '' }}
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
